name: Проверка Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npx --yes pnpm@12.15.0 install --frozen-lockfile
      - run: npx --yes pnpm@12.15.0 check:repo
      - run: npx --yes pnpm@12.15.0 typecheck
      - run: npx --yes pnpm@12.15.0 lint
      # Случайный порядок ловит тесты, зависящие от соседей; упавший порядок повторяется тем же --sequence.seed
      - run: |
          $seed = Get-Random -Minimum 1 -Maximum 2147483647
          Write-Output "Зерно порядка тестов: $seed"
          npx --yes pnpm@12.15.0 exec vitest run --sequence.shuffle --sequence.seed=$seed
      - run: npx --yes pnpm@12.15.0 test:electron
      - run: npx --yes pnpm@12.15.0 build-win
        env:
          SKIP_VMP_SIGNING: 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-test-without-vmp
          path: build/*setup-x64.exe
          retention-days: 7
