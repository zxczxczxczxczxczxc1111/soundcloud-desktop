<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; frame-src soundcloud-desktop:; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex">
    <meta name="color-scheme" content="dark light">
    <title>SoundCloud</title>
    <link rel="stylesheet" href="open.css">
    <script src="open.js" defer></script>
</head>
<body>
    <main>
        <h1 id="title">Открываю трек в клиенте</h1>
        <p id="hint">Если клиента нет, через 5 с откроется сайт</p>
        <div class="actions">
            <a class="button primary" id="app" href="https://soundcloud.com/">Открыть в клиенте</a>
            <a class="button" id="web" href="https://soundcloud.com/">Слушать на soundcloud.com</a>
        </div>
    </main>
</body>
</html>
