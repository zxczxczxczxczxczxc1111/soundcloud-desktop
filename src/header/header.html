<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="header.css" />
    </head>

    <body>
        <div class="custom-header">
            <div class="navigation-controls">
                <div class="nav-button" id="back-btn" title="Назад">
                    <svg width="16" height="16" viewBox="0 0 16 16">
                        <path
                            d="M10.5 3L5.5 8l5 5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>
                <div class="nav-button" id="forward-btn" title="Вперёд">
                    <svg width="16" height="16" viewBox="0 0 16 16">
                        <path
                            d="M5.5 3L10.5 8l-5 5"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>
                <div class="nav-button" id="refresh-btn" title="Обновить страницу">
                    <svg class="refresh-icon" width="16" height="16" viewBox="0 0 16 16">
                        <path
                            d="M13.5 8a5.5 5.5 0 0 1-11 0 5.5 5.5 0 0 1 9.5-3.7"
                            stroke="currentColor"
                            stroke-width="1.3"
                            fill="none"
                            stroke-linecap="round"
                        />
                        <path
                            d="M10.5 2.5 12 4l-1.5 1.5"
                            stroke="currentColor"
                            stroke-width="1.3"
                            fill="none"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                    <svg class="cancel-icon" width="16" height="16" viewBox="0 0 16 16" style="display: none">
                        <path
                            d="M12 4L4 12m8 0L4 4"
                            stroke="currentColor"
                            stroke-width="1.5"
                            fill="none"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </div>
            </div>
            <div class="app-actions">
                <button class="nav-button" id="queue-btn" type="button" title="Очередь" aria-label="Очередь">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 3h12M2 7h12M2 11h7M12 10v4l3-2z" /></svg>
                </button>
                <button class="nav-button" id="history-btn" type="button" title="История, Ctrl+H" aria-label="История, Ctrl+H" aria-pressed="false">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M2.6 8a5.4 5.4 0 1 0 1.6-3.8" />
                        <path d="M2.4 2.6v2.5h2.5" />
                        <path d="M8 5v3.2l2.2 1.4" />
                    </svg>
                </button>
                <button class="nav-button" id="settings-btn" type="button" title="Настройки, F1" aria-label="Настройки, F1">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true">
                        <path d="M6.78 3.46L7.12 1.76L8.88 1.76L9.22 3.46A4.7 4.7 0 0 1 10.35 3.93L11.79 2.97L13.03 4.21L12.07 5.65A4.7 4.7 0 0 1 12.54 6.78L14.24 7.12L14.24 8.88L12.54 9.22A4.7 4.7 0 0 1 12.07 10.35L13.03 11.79L11.79 13.03L10.35 12.07A4.7 4.7 0 0 1 9.22 12.54L8.88 14.24L7.12 14.24L6.78 12.54A4.7 4.7 0 0 1 5.65 12.07L4.21 13.03L2.97 11.79L3.93 10.35A4.7 4.7 0 0 1 3.46 9.22L1.76 8.88L1.76 7.12L3.46 6.78A4.7 4.7 0 0 1 3.93 5.65L2.97 4.21L4.21 2.97L5.65 3.93A4.7 4.7 0 0 1 6.78 3.46Z" />
                        <circle cx="8" cy="8" r="2" />
                    </svg>
                </button>
            </div>
            <div class="title-bar" title="Двойной щелчок разворачивает окно"></div>
            <div class="window-controls">
                <div class="control-group windows-controls">
                    <button
                        class="control minimize"
                        id="minimize-btn"
                        title="Свернуть"
                        aria-label="Свернуть"
                        type="button"
                    >
                        <span class="icon-glyph" aria-hidden="true"></span>
                    </button>
                    <button
                        class="control maximize"
                        id="maximize-btn"
                        title="Развернуть"
                        aria-label="Развернуть"
                        type="button"
                    >
                        <span class="icon-glyph" aria-hidden="true"></span>
                    </button>
                    <button class="control close" id="close-btn" title="Закрыть" aria-label="Закрыть" type="button">
                        <span class="icon-glyph" aria-hidden="true"></span>
                    </button>
                </div>
            </div>
        </div>
        <script src="header.js"></script>
    </body>
</html>
